{% extends "base.html" %}

{% block titulo %}Ingresar · Red Alimenta{% endblock %}

{% block contenido %}
<section class="formulario">
  <h1>Ingresar</h1>
  <p class="bajada">Usa tu correo y tu contraseña.</p>

  <form method="post">
    <label class="campo">Correo
      <input type="email" name="correo" required autofocus autocomplete="username">
    </label>
    <label class="campo">Contraseña
      <input type="password" name="clave" required autocomplete="current-password">
    </label>
    <button class="boton" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
